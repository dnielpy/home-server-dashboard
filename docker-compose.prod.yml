name: home-server-dashboard-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: apps/api
    restart: unless-stopped
    environment:
      # The other apps are reached through the ports they publish on the host
      BLUETTI_API_URL: ${BLUETTI_API_URL:-http://host.docker.internal:3001}
      HOMENET_API_URL: ${HOMENET_API_URL:-http://host.docker.internal:3011}
      LOCALTUBE_API_URL: ${LOCALTUBE_API_URL:-http://host.docker.internal:3005}
      LOCALTUBE_SERVICE_TOKEN: ${LOCALTUBE_SERVICE_TOKEN:?Set LOCALTUBE_SERVICE_TOKEN to LocalTube's SERVICE_TOKEN}
      # The agent that updates the projects runs on the host itself (scripts/install-agent.sh)
      AGENT_URL: ${AGENT_URL:-http://host.docker.internal:3022}
      ASTRO_API_URL: ${ASTRO_API_URL:-http://host.docker.internal:3024}
      ASTRO_API_TOKEN: ${ASTRO_API_TOKEN:?Set ASTRO_API_TOKEN in .env.production}
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-8}
      SENDER_DIR: /data/sender
      DOWNLOADS_DIR: /data/downloads
      DOWNLOADS_PARALLEL: ${DOWNLOADS_PARALLEL:-2}
    volumes:
      # Sender's packages, on the external disk; the folder has to be writable by the container's user (uid 10001)
      - ${SENDER_HOST_DIR:?Set SENDER_HOST_DIR to a folder on the external disk for Sender}:/data/sender
      # The Downloader's files, on the external disk too, with the same owner
      - ${DOWNLOADS_HOST_DIR:?Set DOWNLOADS_HOST_DIR to a folder on the external disk for the Downloader}:/data/downloads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-3021}:3021"
    logging: *logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3021
      # The Energy and Network pages read the Bluetti and Home Net APIs directly, through the ports they publish
      BLUETTI_API_URL: ${BLUETTI_API_URL:-http://host.docker.internal:3001}
      HOMENET_API_URL: ${HOMENET_API_URL:-http://host.docker.internal:3011}
      # Server-rendered dates use the container's timezone
      TZ: ${TZ:-America/Havana}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-3020}:3000"
    logging: *logging
