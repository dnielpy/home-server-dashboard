packages:
  - apps/*

allowBuilds:
  sharp: false
  unrs-resolver: false

fetchRetries: 8
fetchRetryFactor: 2
fetchRetryMintimeout: 20000
fetchRetryMaxtimeout: 180000
# The server's connection can be slow enough that a big tarball (next) takes more than 5 minutes
fetchTimeout: 1800000
networkConcurrency: 4
