<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The animations are code written by Astro: they run in a sandboxed iframe and cannot reach the network -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
  <title>Astro</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    /* On the server's display (?kiosk) there is no mouse to show */
    html.kiosk, html.kiosk body { cursor: none; }
    body {
      background:
        radial-gradient(ellipse at 22% 85%, rgba(255, 46, 99, .14) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 42%, #0c1a45 0%, #050a1f 50%, #010207 100%);
      font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    }
    #stage, #fx { position: fixed; inset: 0; width: 100%; height: 100%; }
    #fx { pointer-events: none; }
    #astro-box {
      position: fixed; left: 50%; top: 50%;
      height: min(86vh, 110vw); aspect-ratio: 400 / 460;
      transform: translate(-50%, -48%);
    }
    #astro-box > svg { width: 100%; height: 100%; display: block; }
    .face { width: 200px; height: 144px; display: block; }
    .sign-text {
      width: 240px; height: 122px; display: flex; align-items: center; justify-content: center;
      text-align: center; color: #f4fbff; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere;
      text-shadow: 0 0 6px #27e8ff, 0 0 16px #27e8ff;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="astro-box"></div>
  <canvas id="fx"></canvas>
  <script src="kiosk.js"></script>
  <script src="runtime.js"></script>
</body>
</html>
